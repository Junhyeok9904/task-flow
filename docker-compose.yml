
services:
  web:
    build: .
    image: task-flow-web:latest
    container_name: playlist-web
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-6001}:3000"
    volumes:
      - ./data:/app/data
      - ./public/media:/app/public/media
    environment:
      - IS_DOCKER=true
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --url http://web:3000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
