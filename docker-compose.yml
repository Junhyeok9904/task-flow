version: '3.8'

services:
  web:
    build: .
    container_name: playlist-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --url http://web:3000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
